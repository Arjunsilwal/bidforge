[project]
name = "bidforge"
version = "0.1.0"
description = "AI preconstruction estimating engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Arjun Silwal" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "sentence-transformers>=2.5.0",
    "openpyxl>=3.1.2",
    "pdfplumber>=0.10.4",
    "pypdf>=4.1.0",
    "mlflow>=2.11.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.32.0",
    "anthropic>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    # Kept in lockstep with requirements.txt; see the note there on why these are pinned.
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pre-commit>=3.6.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
# Matches the `requires-python` floor above; the CI matrix also runs 3.12.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once at import time by design,
# so calling them in argument defaults is the documented idiom, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
]

[tool.mypy]
# Deliberately no `python_version`: mypy defaults to the interpreter it runs under, so
# each CI matrix leg is checked against the dependency versions actually installed for
# it. Pinning a version here breaks the other leg — numpy's newest wheels ship stubs
# using PEP 695 `type` statements, which mypy rejects when told to target 3.11.
# Teaches mypy how pydantic synthesizes `__init__`, so `Field(None, ...)` is
# understood as an optional argument with a default.
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
