version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bidforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bidforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bidforge_password}
      POSTGRES_DB: ${POSTGRES_DB:-bidforge_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidforge} -d ${POSTGRES_DB:-bidforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: bidforge-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: bidforge-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-bidforge}:${POSTGRES_PASSWORD:-bidforge_password}@postgres:5432/${POSTGRES_DB:-bidforge_db}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FRED_API_KEY=${FRED_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - ..:/app

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: bidforge-web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ..:/app

volumes:
  postgres_data:
  mlflow_data:
