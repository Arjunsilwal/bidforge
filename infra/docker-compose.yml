## BidForge local stack.
##
## POSTGRES_PASSWORD is required and has no default on purpose: a hardcoded fallback
## password is a real credential once someone exposes the port or reuses the compose
## file beyond their laptop. Copy .env.example to .env and set it before `up`.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bidforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bidforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bidforge_db}
    ports:
      # Bound to loopback: the database is reachable from this machine for psql//inspection,
      # but is not published on the host's external interfaces.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidforge} -d ${POSTGRES_DB:-bidforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: bidforge-mlflow
    restart: unless-stopped
    ports:
      # MLflow's server ships no authentication, so it stays on loopback rather than
      # being published to the network.
      - "127.0.0.1:5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: bidforge-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-bidforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-bidforge_db}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FRED_API_KEY=${FRED_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8501}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    # No source bind-mount: the container runs the code baked into the image. Mounting
    # the repo would also expose .git and .env to the container and shadow the build.
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: bidforge-web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  mlflow_data:
